<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- MANDATORY: Declare support for both light and dark themes to eliminate FOUC -->
  <meta name="color-scheme" content="light dark">
  <title>Aria — Sovereign AI Personal Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* MANDATORY: Apply color-scheme to :root for viewport-wide native UI theming */
    :root {
      color-scheme: light dark;

      /* OKLCH Color Tokens via light-dark() */
      --bg-canvas-light: oklch(98.5% 0.005 240);
      --bg-canvas-dark: oklch(14.5% 0.015 260);
      --bg-canvas: light-dark(var(--bg-canvas-light), var(--bg-canvas-dark));

      --bg-surface-light: oklch(100% 0 0);
      --bg-surface-dark: oklch(19.5% 0.018 260);
      --bg-surface: light-dark(var(--bg-surface-light), var(--bg-surface-dark));

      --bg-surface-alt-light: oklch(96% 0.008 240);
      --bg-surface-alt-dark: oklch(24% 0.022 260);
      --bg-surface-alt: light-dark(var(--bg-surface-alt-light), var(--bg-surface-alt-dark));

      --border-subtle-light: oklch(90% 0.01 240);
      --border-subtle-dark: oklch(28% 0.02 260);
      --border-subtle: light-dark(var(--border-subtle-light), var(--border-subtle-dark));

      --text-main-light: oklch(18% 0.02 260);
      --text-main-dark: oklch(94% 0.01 240);
      --text-main: light-dark(var(--text-main-light), var(--text-main-dark));

      --text-muted-light: oklch(48% 0.02 250);
      --text-muted-dark: oklch(68% 0.02 250);
      --text-muted: light-dark(var(--text-muted-light), var(--text-muted-dark));

      --accent-primary-light: oklch(58% 0.22 28);  /* Warm Coral / Amber */
      --accent-primary-dark: oklch(68% 0.22 32);
      --accent-primary: light-dark(var(--accent-primary-light), var(--accent-primary-dark));

      --accent-glow: oklch(68% 0.22 32 / 0.15);

      --assistant-bubble-light: oklch(96.5% 0.005 240);
      --assistant-bubble-dark: oklch(22% 0.018 260);
      --assistant-bubble: light-dark(var(--assistant-bubble-light), var(--assistant-bubble-dark));

      --user-bubble: var(--accent-primary);
      --user-bubble-text: oklch(99% 0 0);

      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-canvas);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.5;
    }

    /* Top Bar */
    header {
      padding: 12px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .companion-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), oklch(75% 0.18 60));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-info h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-info p {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    /* Live Checkpoint Card */
    .checkpoint-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .checkpoint-badge strong {
      color: var(--text-main);
    }

    /* Token Budget Visualizer */
    .budget-bar-wrap {
      padding: 8px 20px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .budget-track {
      flex: 1;
      height: 8px;
      background: var(--bg-surface-alt);
      border-radius: 4px;
      overflow: hidden;
      display: flex;
    }

    .budget-seg-persona { background: #3b82f6; width: 9.3%; }   /* 384 / 4096 */
    .budget-seg-profile { background: #10b981; width: 6.2%; }   /* 256 / 4096 */
    .budget-seg-memories { background: #8b5cf6; width: 12.5%; } /* 512 / 4096 */
    .budget-seg-history { background: #f59e0b; width: 25%; transition: width 0.3s ease; }
    .budget-seg-headroom { background: transparent; flex: 1; }

    /* Main Layout */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Chat Viewport */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 80%;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.assistant {
      align-self: flex-start;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg-row.assistant .msg-bubble {
      background: var(--assistant-bubble);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
    }

    .msg-row.user .msg-bubble {
      background: var(--user-bubble);
      color: var(--user-bubble-text);
      border-bottom-right-radius: 4px;
    }

    .msg-meta {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    .msg-feedback {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .msg-feedback:hover {
      opacity: 1;
    }

    .feedback-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      font-family: inherit;
    }

    .feedback-btn:hover {
      background: var(--bg-surface-alt);
      color: var(--text-main);
      border-color: var(--border-focus);
    }

    .feedback-btn.active {
      background: var(--accent-subtle);
      border-color: var(--accent-primary);
      color: var(--accent-primary);
      font-weight: 600;
    }

    /* Composer Form */
    .composer-wrap {
      padding: 16px 20px 20px;
      background: var(--bg-surface);
      border-top: 1px solid var(--border-subtle);
      flex-shrink: 0;
    }

    .composer-form {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      padding: 8px 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .composer-form:focus-within {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    textarea#chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 14.5px;
      color: var(--text-main);
      resize: none;
      max-height: 140px;
      line-height: 1.4;
      padding: 6px 0;
    }

    button[type="submit"] {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s, transform 0.1s;
    }

    button[type="submit"]:hover {
      opacity: 0.92;
    }

    button[type="submit"]:active {
      transform: scale(0.98);
    }

    button[type="submit"]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Quick Action Controls */
    .controls-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .quick-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 9999px;
      padding: 4px 10px;
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .chip-btn:hover {
      background: var(--border-subtle);
      color: var(--text-main);
    }

    .pacing-pill {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand-wrap">
      <div class="companion-avatar" aria-hidden="true">A</div>
      <div class="brand-info">
        <h1>Aria</h1>
        <p><span class="status-dot"></span> GTX 1650 Mobile • Qwen2.5-3B Sovereign</p>
      </div>
    </div>

    <div id="checkpoint-badge" class="checkpoint-badge">
      <span>Checkpoint: <strong>AI Startup Pitch Deck</strong> (in_progress)</span>
    </div>
  </header>

  <!-- Deterministic Token Budget Bar (4,096 tokens total) -->
  <div class="budget-bar-wrap" aria-label="Context Window Budget Allocation">
    <span>Budget (4K):</span>
    <div class="budget-track" title="Persona: 384, Profile: 256, Memory: 512, History: Dynamic">
      <div class="budget-seg-persona" title="Persona: 384 tokens"></div>
      <div class="budget-seg-profile" title="Profile: 256 tokens"></div>
      <div class="budget-seg-memories" title="Episodic Memory: 512 tokens"></div>
      <div id="history-segment" class="budget-seg-history" title="Active History"></div>
      <div class="budget-seg-headroom" title="Generation Headroom"></div>
    </div>
    <span id="token-counter">~1,840 / 4,096 tokens (Compaction @ 75%)</span>
  </div>

  <!-- Main Chat Conversation View -->
  <main>
    <div class="chat-container">
      <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
        <!-- Initial seeded check-in turn -->
        <div class="msg-row assistant">
          <div class="msg-bubble">
            Good evening! How's your night coming along? Are you wrapping up work or taking some time to recharge?
          </div>
        </div>
      </div>

      <!-- Composer Form -->
      <div class="composer-wrap">
        <form id="chat-form" class="composer-form">
          <label for="chat-input" class="visually-hidden">Message Aria</label>
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Talk with Aria... (Enter to send, Shift+Enter for newline)"
            autocomplete="off"
            required
          ></textarea>
          <button type="submit" id="send-button">
            <span>Send</span>
          </button>
        </form>

        <div class="controls-row">
          <div class="quick-chips">
            <button type="button" class="chip-btn" id="chip-tiktok">"Just scrolling through TikTok."</button>
            <button type="button" class="chip-btn" id="chip-tired">"I'm exhausted, continuing tomorrow."</button>
            <button type="button" class="chip-btn" id="chip-checkin">⚡ Simulate Proactive Check-in</button>
          </div>
          <span class="pacing-pill">Quiet Hours: 23:00–08:00 (Asia/Riyadh)</span>
        </div>
      </div>
    </div>
  </main>

  <script>
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const textarea = document.getElementById('chat-input');
    const sendButton = document.getElementById('send-button');
    const tokenCounter = document.getElementById('token-counter');
    const historySegment = document.getElementById('history-segment');

    // Conversation identifier
    const conversationId = "conv_default";

    // Auto-scroll utility
    function scrollToBottom() {
      chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
    }

    // Auto-resize textarea
    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
    });

    /**
     * Modern Web Guidance: ime-safe-enter-submit
     * Prevents submitting incomplete text during IME character composition (Japanese, Chinese, Korean, virtual keyboards)
     * Pairs event.isComposing with event.keyCode === 229 fallback to reliably handle Safari timing quirks.
     */
    textarea.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();

        // Block submission if composing natively or if keyCode is 229
        if (event.isComposing || event.keyCode === 229) {
          return;
        }

        chatForm.requestSubmit();
      }
    });

    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `msg-row ${role}`;
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      row.appendChild(bubble);
      chatMessages.appendChild(row);
      scrollToBottom();
      return { row, bubble };
    }

    function attachFeedbackUI(row, messageId, promptText, replyText) {
      if (!messageId && !replyText) return;
      const fbWrap = document.createElement('div');
      fbWrap.className = 'msg-feedback';

      const upBtn = document.createElement('button');
      upBtn.className = 'feedback-btn';
      upBtn.innerHTML = '👍 Good';
      upBtn.title = 'Flywheel thumbs up';

      const downBtn = document.createElement('button');
      downBtn.className = 'feedback-btn';
      downBtn.innerHTML = '👎 Needs work';
      downBtn.title = 'Flywheel thumbs down';

      const sendFeedback = async (thumb, clickedBtn, otherBtn) => {
        clickedBtn.classList.add('active');
        otherBtn.classList.remove('active');
        try {
          await fetch('/v1/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              conversation_id: conversationId,
              message_id: messageId || '',
              thumb: thumb,
              prompt: promptText,
              response: replyText
            })
          });
        } catch (e) {
          console.error('Feedback failed:', e);
        }
      };

      upBtn.addEventListener('click', () => sendFeedback('up', upBtn, downBtn));
      downBtn.addEventListener('click', () => sendFeedback('down', downBtn, upBtn));

      fbWrap.appendChild(upBtn);
      fbWrap.appendChild(downBtn);
      row.appendChild(fbWrap);
      scrollToBottom();
    }

    async function handleChatSubmit(userText) {
      if (!userText.trim()) return;

      appendMessage('user', userText);
      textarea.value = '';
      textarea.style.height = 'auto';
      sendButton.disabled = true;

      const { row: assistantRow, bubble: assistantBubble } = appendMessage('assistant', '...');
      let lastMsgId = '';

      try {
        const response = await fetch('/v1/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            conversation_id: conversationId,
            message: userText,
            stream: true
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let fullText = '';
        assistantBubble.textContent = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const dataStr = line.slice(6).trim();
              if (dataStr === '[DONE]') break;
              try {
                const parsed = JSON.parse(dataStr);
                if (parsed.message_id) {
                  lastMsgId = parsed.message_id;
                }
                if (parsed.token) {
                  fullText += parsed.token;
                  assistantBubble.textContent = fullText;
                  scrollToBottom();
                }
                if (parsed.total_tokens) {
                  updateTokenDisplay(parsed.total_tokens);
                }
              } catch (e) {
                // partial raw text
                fullText += dataStr;
                assistantBubble.textContent = fullText;
              }
            }
          }
        }
        if (fullText && !fullText.includes('Sorry, connection error')) {
          attachFeedbackUI(assistantRow, lastMsgId, userText, fullText);
        }
      } catch (err) {
        assistantBubble.textContent = "Sorry, connection error: " + err.message;
      } finally {
        sendButton.disabled = false;
        textarea.focus();
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleChatSubmit(textarea.value);
    });

    function updateTokenDisplay(total) {
      const percentage = Math.min(100, (total / 4096) * 100);
      tokenCounter.textContent = `~${total} / 4,096 tokens (${percentage.toFixed(0)}% utilization)`;
      historySegment.style.width = Math.max(10, percentage - 28) + '%';
    }

    // Quick Action Chips
    document.getElementById('chip-tiktok').addEventListener('click', () => {
      textarea.value = "Just scrolling through TikTok.";
      chatForm.requestSubmit();
    });

    document.getElementById('chip-tired').addEventListener('click', () => {
      textarea.value = "I'm exhausted, heading to bed. Will continue the pitch deck tomorrow.";
      chatForm.requestSubmit();
    });

    document.getElementById('chip-checkin').addEventListener('click', async () => {
      try {
        const resp = await fetch('/v1/checkin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversation_id: conversationId })
        });
        const data = await resp.json();
        if (data.checkin_message) {
          const { row } = appendMessage('assistant', data.checkin_message);
          attachFeedbackUI(row, 'checkin_' + Date.now(), 'proactive_checkin', data.checkin_message);
        } else if (data.status) {
          appendMessage('assistant', `[Pacing Engine: ${data.status}]`);
        }
      } catch (e) {
        console.error(e);
      }
    });
  </script>
</body>
</html>
